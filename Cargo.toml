[package]
name = "loom"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
cpal = { version = "0.18.2", features = ["pipewire"] }
hound = "3.5.1"
pipewire = { version = "0.10.1", features = ["v1_2_0"] }
iced = { version = "0.14.0", features = ["canvas", "tokio"] }
